<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sora Casas · CRM · Deal Pipeline</title>
<meta name="robots" content="noindex"><meta name="theme-color" content="#1d3a2c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="casas-ops.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="word"><em>Sora</em> Casas</span><span class="sub">CRM · Pipeline</span></div>
  <span class="spacer"></span>
  <button class="btn btn-primary" onclick="openForm()" data-es="+ Deal" data-en="+ Deal">+ Deal</button>
  <button class="btn btn-ghost" onclick="importLeads()" data-es="Importar leads capturados" data-en="Import captured leads">Import captured leads</button>
  <button class="btn btn-ghost" onclick="CasasOps.exportJSON(DEALS,'sora-crm.json')">Export</button>
  <label class="btn btn-ghost" style="cursor:pointer"><span data-es="Importar" data-en="Import">Import</span><input type="file" accept="application/json" onchange="CasasOps.importJSON(event,d=>{DEALS=d;save();render();})" style="display:none"></label>
  <div class="lang-toggle"><button data-lang="es">ES</button><button data-lang="en" class="active">EN</button></div>
  <a class="btn btn-ghost" href="sora-casas-ops.html">← Ops</a>
</div></header>

<div class="wrap">
  <h1 data-es-html="El <em>pipeline</em>" data-en-html="The <em>pipeline</em>">The <em>pipeline</em></h1>
  <p class="lede" data-es="Cada lead que entra por los embudos vive aquí hasta que se convierte en casa vendida. 100 leads = 1 casa = $100K." data-en="Every lead from the funnels lives here until it becomes a home sold. 100 leads = 1 home = $100K.">Every lead from the funnels lives here until it becomes a home sold. 100 leads = 1 home = $100K.</p>

  <div class="cards" id="cards"></div>
  <div class="pipe" id="pipe"></div>

  <div class="bar">
    <select id="f-stage" onchange="render()"><option value="" data-es="Todas las etapas" data-en="All stages">All stages</option></select>
    <select id="f-source" onchange="render()"><option value="" data-es="Todas las fuentes" data-en="All sources">All sources</option></select>
    <select id="f-market" onchange="render()"><option value="" data-es="Todos los mercados" data-en="All markets">All markets</option><option>Pedasí</option><option>Boquete</option><option>Volcán</option><option>Bocas del Toro</option><option>Coronado</option></select>
    <span class="spacer"></span><span class="note" id="count"></span>
  </div>

  <div style="overflow-x:auto"><table>
    <thead><tr>
      <th data-es="Deal" data-en="Deal">Deal</th>
      <th data-es="Fuente" data-en="Source">Source</th>
      <th data-es="Persona" data-en="Persona">Persona</th>
      <th data-es="Mercado" data-en="Market">Market</th>
      <th class="r" data-es="Valor" data-en="Value">Value</th>
      <th data-es="Etapa" data-en="Stage">Stage</th>
      <th data-es="Próx. acción" data-en="Next action">Next action</th>
      <th data-es="Responsable" data-en="Owner">Owner</th>
      <th></th>
    </tr></thead><tbody id="rows"></tbody>
  </table></div>
  <p class="note" id="hint"></p>
</div>

<!-- MODAL -->
<div class="modal" id="modal"><div class="sheet">
  <h3 id="form-title"><em data-es="Nuevo" data-en="New">New</em> deal</h3>
  <form id="deal-form" onsubmit="return saveDeal(event)"><input type="hidden" name="id">
    <div class="grid2">
      <div class="f"><label data-es="Nombre" data-en="Name">Name</label><input name="name" required placeholder="—"></div>
      <div class="f"><label data-es="Contacto (WhatsApp/email)" data-en="Contact (WhatsApp/email)">Contact</label><input name="contact" placeholder="+1 … / email"></div>
      <div class="f"><label data-es="Fuente" data-en="Source">Source</label><select name="source"><option value="qiv">QIV</option><option value="guide" data-es="Guía" data-en="Guide">Guide</option><option value="discovery">Discovery Weekend</option><option value="organic" data-es="Orgánico" data-en="Organic">Organic</option><option value="paid" data-es="Pauta" data-en="Paid">Paid</option><option value="referral" data-es="Referido" data-en="Referral">Referral</option><option value="walkin" data-es="Directo" data-en="Walk-in">Walk-in</option></select></div>
      <div class="f"><label data-es="Persona" data-en="Persona">Persona</label><select name="persona"><option value="">—</option><option value="fire" data-es="Retirado FIRE" data-en="FIRE retiree">FIRE retiree</option><option value="surfer" data-es="Nómada/surfista" data-en="Remote surfer">Remote surfer</option><option value="diversifier" data-es="Diversificador UE/UK" data-en="UK/EU diversifier">UK/EU diversifier</option><option value="planb" data-es="Plan-B / visa" data-en="Plan-B / visa">Plan-B / visa</option><option value="latam" data-es="Familia LatAm" data-en="LatAm family">LatAm family</option></select></div>
      <div class="f"><label data-es="Mercado" data-en="Market">Market</label><select name="market"><option value="">—</option><option>Pedasí</option><option>Boquete</option><option>Volcán</option><option>Bocas del Toro</option><option>Coronado</option></select></div>
      <div class="f"><label data-es="Modelo / interés" data-en="Model / interest">Model / interest</label><input name="model" placeholder="Casa Bahía · lote · QIV…"></div>
      <div class="f"><label data-es="Lote vinculado (Land Bank)" data-en="Linked lot (Land Bank)">Linked lot</label><input name="lot" placeholder="Pedasí · Lote 3"></div>
      <div class="f"><label data-es="Valor esperado ($)" data-en="Expected value ($)">Expected value ($)</label><input name="value" type="number" min="0" placeholder="400000"></div>
      <div class="f"><label data-es="Etapa" data-en="Stage">Stage</label><select name="stage" id="stage-sel"></select></div>
      <div class="f"><label data-es="Responsable" data-en="Owner">Owner</label><input name="owner" placeholder="Marcos / rep"></div>
      <div class="f"><label data-es="Próxima acción" data-en="Next action">Next action</label><input name="next_action" placeholder="—"></div>
      <div class="f"><label data-es="Fecha próx. acción" data-en="Next action date">Next action date</label><input name="next_date" type="date"></div>
      <div class="f full"><label data-es="Notas" data-en="Notes">Notes</label><textarea name="notes" rows="2"></textarea></div>
    </div>
    <div class="sheet-foot"><button type="button" class="btn btn-ghost" onclick="close_()" data-es="Cancelar" data-en="Cancel">Cancel</button><button type="submit" class="btn btn-primary" data-es="Guardar" data-en="Save">Save</button></div>
  </form>
</div></div>

<script src="casas-ops.js"></script>
<script>
  const O = CasasOps, L = () => O.lang();
  const STAGE = {
    lead:{es:'Lead',en:'Lead',c:'b-grey',p:.05}, qualified:{es:'Calificado',en:'Qualified',c:'b-blue',p:.15},
    call:{es:'Llamada',en:'Disc. call',c:'b-teal',p:.30}, visit:{es:'Visita',en:'Site visit',c:'b-gold',p:.50},
    loi:{es:'LOI',en:'LOI',c:'b-warn',p:.75}, deposit:{es:'Depósito',en:'Deposit',c:'b-coral',p:.90},
    closing:{es:'Cierre',en:'Closing',c:'b-coral',p:.95}, won:{es:'Ganado',en:'Won',c:'b-green',p:1}, lost:{es:'Perdido',en:'Lost',c:'b-red',p:0}
  };
  const ORDER = ['lead','qualified','call','visit','loi','deposit','closing','won','lost'];
  const ACTIVE = ['lead','qualified','call','visit','loi','deposit','closing'];
  const SRC = {qiv:{es:'QIV',en:'QIV'},guide:{es:'Guía',en:'Guide'},discovery:{es:'Discovery',en:'Discovery'},organic:{es:'Orgánico',en:'Organic'},paid:{es:'Pauta',en:'Paid'},referral:{es:'Referido',en:'Referral'},walkin:{es:'Directo',en:'Walk-in'}};
  const PERS = {fire:{es:'FIRE',en:'FIRE'},surfer:{es:'Surfista',en:'Surfer'},diversifier:{es:'Diversif.',en:'Diversifier'},planb:{es:'Plan-B',en:'Plan-B'},latam:{es:'LatAm',en:'LatAm'}};
  const KEY='sora.casas.crm';
  const SEED=[
    {id:'s1',name:'John & Mary Smith',contact:'+1 941…',source:'qiv',persona:'planb',market:'Pedasí',model:'Casa Bahía + QIV',lot:'Pedasí · Lote Playa 3',value:400000,stage:'deposit',owner:'Marcos',next_action:'Coordinar hito fundación',next_date:'2026-06-20',notes:'Ej. Depósito 30% recibido. QIV en trámite.'},
    {id:'s2',name:'Linda Foster',contact:'linda@…',source:'discovery',persona:'fire',market:'Boquete',model:'Casa Montaña',lot:'',value:430000,stage:'visit',owner:'Rep 1',next_action:'Discovery Weekend 14–16 jun',next_date:'2026-06-14',notes:'Ej. Viene a Boquete.'},
    {id:'s3',name:'David Eskildsen',contact:'+507 6…',source:'guide',persona:'surfer',market:'Pedasí',model:'Lote + build',lot:'',value:350000,stage:'qualified',owner:'Rep 1',next_action:'Agendar llamada',next_date:'2026-06-13',notes:'Ej. Descargó la guía de costos.'}
  ];
  let DEALS = O.load(KEY,SEED);
  const save=()=>O.save(KEY,DEALS);

  // build stage selects
  ['f-stage','stage-sel'].forEach(id=>{ const s=document.getElementById(id); ORDER.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=STAGE[k].en; o.setAttribute('data-es',STAGE[k].es); o.setAttribute('data-en',STAGE[k].en); s.appendChild(o); }); });
  // source filter
  (function(){ const s=document.getElementById('f-source'); Object.keys(SRC).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=SRC[k].en; o.setAttribute('data-es',SRC[k].es); o.setAttribute('data-en',SRC[k].en); s.appendChild(o); }); })();

  function render(){
    const l=L(), fs=val('f-stage'), fsrc=val('f-source'), fm=val('f-market');
    const view=DEALS.filter(d=>(!fs||d.stage===fs)&&(!fsrc||d.source===fsrc)&&(!fm||d.market===fm));
    const active=DEALS.filter(d=>ACTIVE.includes(d.stage));
    const weighted=active.reduce((a,d)=>a+((+d.value||0)*STAGE[d.stage].p),0);
    const thisMonth=DEALS.filter(d=>d.stage==='lead').length;
    const won=DEALS.filter(d=>d.stage==='won');
    const wonVal=won.reduce((a,d)=>a+(+d.value||0),0);
    const C=(v,k,cls='')=>`<div class="card ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`;
    document.getElementById('cards').innerHTML=
      C(DEALS.length,l==='es'?'Deals totales':'Total deals')+
      C(active.length,l==='es'?'En pipeline activo':'Active in pipeline','c-teal')+
      C(O.money0(active.reduce((a,d)=>a+(+d.value||0),0)),l==='es'?'Valor del pipeline':'Pipeline value')+
      C(O.money0(weighted),l==='es'?'Valor ponderado (prob.)':'Weighted value (prob.)','c-gold')+
      C(won.length,l==='es'?'Ganados':'Won','c-ok')+
      C(O.money0(wonVal),l==='es'?'Ingreso ganado':'Won revenue','c-coral');
    // pipeline strip
    document.getElementById('pipe').innerHTML=ACTIVE.concat(['won']).map(st=>{
      const n=DEALS.filter(d=>d.stage===st).length;
      const v=DEALS.filter(d=>d.stage===st).reduce((a,d)=>a+(+d.value||0),0);
      return `<div class="pseg" style="border-left-color:${stcolor(st)}"><div class="pn">${STAGE[st][l]}</div><div class="pv">${n}</div><div class="pm">${O.money0(v)}</div></div>`;
    }).join('');
    // rows
    document.getElementById('count').textContent=view.length+' '+(l==='es'?'deals':'deals');
    document.getElementById('hint').textContent=l==='es'?'Datos en este navegador. "Importar leads capturados" trae los leads guardados por los embudos en este navegador (para producción: conecta el inbox de FormSubmit o una hoja).':'Data in this browser. "Import captured leads" pulls leads the funnels saved in THIS browser (for production: connect the FormSubmit inbox or a sheet).';
    if(!view.length){ document.getElementById('rows').innerHTML=`<tr><td colspan="9" class="empty">${l==='es'?'Sin deals.':'No deals yet.'}</td></tr>`; return; }
    const ord=s=>ORDER.indexOf(s);
    document.getElementById('rows').innerHTML=view.sort((a,b)=>ord(a.stage)-ord(b.stage)).map(d=>{
      const dt=O.daysTo(d.next_date), soon=dt!=null&&dt<=2;
      return `<tr>
        <td><div class="nm">${O.esc(d.name)}</div><div class="td-sub">${O.esc(d.contact||'')}${d.lot?' · '+O.esc(d.lot):''}</div></td>
        <td><span class="badge b-grey">${O.lab(SRC,d.source,l)}</span></td>
        <td>${d.persona?O.lab(PERS,d.persona,l):'—'}</td>
        <td>${O.esc(d.market||'—')}<div class="td-sub">${O.esc(d.model||'')}</div></td>
        <td class="r">${O.money0(d.value)}</td>
        <td><span class="badge ${STAGE[d.stage].c}">${STAGE[d.stage][l]}</span></td>
        <td><div class="${soon?'warnsoon':''}">${O.esc(d.next_action||'—')}</div><div class="td-sub">${O.dateShort(d.next_date,l)}${(soon&&dt>=0)?' · '+dt+'d':''}</div></td>
        <td>${O.esc(d.owner||'—')}</td>
        <td><div class="row-act"><button onclick="openForm('${d.id}')">✎</button><button onclick="advance('${d.id}')" title="advance">→</button><button onclick="del('${d.id}')">✕</button></div></td>
      </tr>`;
    }).join('');
  }
  function stcolor(st){return {lead:'#8a7e6a',qualified:'#3a6e9c',call:'#2e8a96',visit:'#b88842',loi:'#c98a2a',deposit:'#D9573B',closing:'#D9573B',won:'#3f8f5e'}[st]||'#8a7e6a';}
  const val=id=>document.getElementById(id).value;

  function openForm(id){ const f=document.getElementById('deal-form'); f.reset(); const l=L();
    document.getElementById('form-title').innerHTML=`<em>${id?(l==='es'?'Editar':'Edit'):(l==='es'?'Nuevo':'New')}</em> deal`;
    if(id){ const d=DEALS.find(x=>x.id===id); if(d) Object.keys(d).forEach(k=>{ if(f.elements[k]) f.elements[k].value=d[k]; }); }
    document.getElementById('modal').classList.add('open');
  }
  function close_(){ document.getElementById('modal').classList.remove('open'); }
  function saveDeal(e){ e.preventDefault(); const d=Object.fromEntries(new FormData(e.target));
    if(d.id){ const i=DEALS.findIndex(x=>x.id===d.id); if(i>=0) DEALS[i]={...DEALS[i],...d}; } else { d.id=O.uid(); d.created=new Date().toISOString(); DEALS.push(d); }
    save(); close_(); render(); return false; }
  function del(id){ if(confirm(L()==='es'?'¿Eliminar?':'Delete?')){ DEALS=DEALS.filter(x=>x.id!==id); save(); render(); } }
  function advance(id){ const d=DEALS.find(x=>x.id===id); if(!d) return; const i=ACTIVE.indexOf(d.stage); if(i>=0&&i<ACTIVE.length-1) d.stage=ACTIVE[i+1]; else if(d.stage==='closing') d.stage='won'; save(); render(); }
  function importLeads(){
    const leads=O.peek('sora.casas.leads'); if(!leads.length){ alert(L()==='es'?'No hay leads capturados en este navegador.':'No captured leads in this browser.'); return; }
    let added=0; const have=new Set(DEALS.map(d=>(d.contact||'').toLowerCase()));
    leads.forEach(x=>{ const c=(x.email||x.whatsapp||'').toLowerCase(); if(c&&have.has(c)) return;
      DEALS.push({id:O.uid(),name:x.nombre||x.name||'(lead)',contact:x.email||x.whatsapp||'',source:x.type==='reservation'?'organic':(x.type==='sell'?'walkin':(x.type||'organic')),persona:'',market:x.zona||'',model:x.type||'',lot:'',value:'',stage:'lead',owner:'',next_action:L()==='es'?'Responder en <2h':'Respond in <2h',next_date:new Date().toISOString().slice(0,10),notes:'Auto-importado del embudo · '+(x.type||'')}); added++; have.add(c); });
    save(); render(); alert((L()==='es'?'Importados: ':'Imported: ')+added);
  }
  O.cloudSync(KEY, d=>{ DEALS=d; render(); });
  O.initLang(render);
</script>
</body>
</html>
