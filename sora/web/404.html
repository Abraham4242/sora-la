<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · No encontrado · SORA Travel Agency</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f7f0df'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='400' fill='%23e07a5f'%3ES%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1d3a2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f0df;
    --ink: #1c140c;
    --ink-2: rgba(28,20,12,0.72);
    --ink-3: rgba(28,20,12,0.5);
    --coral: #e07a5f;
    --coral-deep: #b85439;
    --green: #1d3a2c;
    --gold: #d4b87a;
    --mango: #f4b942;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse 75% 50% at 70% 22%, rgba(244,185,66,0.55), transparent 60%),
      radial-gradient(ellipse 90% 60% at 25% 38%, rgba(224,122,95,0.45), transparent 65%),
      linear-gradient(180deg, #2a1a14 0%, #1f3024 55%, #0a1812 100%);
    color: var(--cream); font-family: var(--sans);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }
  .wrap { max-width: 540px; position: relative; z-index: 2; }
  .num {
    font-family: var(--serif); font-style: italic; font-weight: 300;
    font-size: clamp(96px, 18vw, 180px);
    line-height: 0.9; letter-spacing: -0.04em;
    color: var(--mango);
    margin-bottom: 12px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 5px;
    color: var(--gold); font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.1; letter-spacing: -0.015em;
    margin-bottom: 14px;
  }
  h1 em { font-style: italic; color: var(--mango); }
  p {
    font-size: 16px; color: rgba(247,240,223,0.75);
    line-height: 1.55;
    margin-bottom: 36px;
  }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .actions a {
    background: var(--coral); color: #fff;
    padding: 14px 24px; border-radius: 100px;
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 12px 28px -10px rgba(224,122,95,0.55);
    transition: transform .15s;
  }
  .actions a:hover { transform: translateY(-1px); }
  .actions a.ghost {
    background: transparent;
    border: 1px solid rgba(247,240,223,0.32);
    color: var(--cream);
    box-shadow: none;
  }
  .actions a.ghost:hover { background: rgba(247,240,223,0.08); }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars span {
    position: absolute; width: 2px; height: 2px;
    background: #fbf6e8; border-radius: 50%;
    opacity: 0.5;
  }
  .stars span:nth-child(1) { top: 14%; left: 12%; }
  .stars span:nth-child(2) { top: 28%; left: 40%; width: 2.5px; height: 2.5px; }
  .stars span:nth-child(3) { top: 8%; left: 72%; }
  .stars span:nth-child(4) { top: 22%; left: 88%; }
  .stars span:nth-child(5) { top: 38%; left: 22%; }
</style>
</head>
<body>
<div class="stars">
  <span></span><span></span><span></span><span></span><span></span>
</div>
<div class="wrap">
  <div class="eyebrow">PERDIDOS EN LOS RUBÉN ROCKS</div>
  <div class="num">404</div>
  <h1>Esta ruta no <em>existe</em>.</h1>
  <p>Lo que buscás no está aquí. Puede que el enlace esté roto, o que esta página todavía no se haya construido. Volvé al sitio principal o escribinos.</p>
  <div class="actions">
    <a href="index.html">↩ Volver a SORA</a>
    <a href="#" id="wa-link" class="ghost">WhatsApp</a>
  </div>
</div>
<script>
  // Best-effort WA link from saved config or fallback
  try {
    const cfg = JSON.parse(localStorage.getItem('sora.config.byCountry') || '{}');
    const country = localStorage.getItem('sora.country') || 'PA';
    const wa = (cfg[country]?.whatsapp) || (cfg.PA?.whatsapp) || '50760000000';
    document.getElementById('wa-link').href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Hola Sora! Llegué a una página 404 buscando algo en el sitio.');
  } catch (e) {}
</script>
</body>
</html>
