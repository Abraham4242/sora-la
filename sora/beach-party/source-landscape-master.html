<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beach Party · Pedasí · Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#070912}

  .flyer{
    position:relative;
    width:1920px;
    height:1080px;
    overflow:hidden;
    color:#fbf6e8;
    font-family:'Inter',sans-serif;
    isolation:isolate;
  }

  .sky{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 45% 80% at 32% 52%, rgba(255,221,150,0.55) 0%, rgba(255,221,150,0) 60%),
      radial-gradient(ellipse 60% 70% at 32% 60%, rgba(224,122,95,0.78) 0%, rgba(224,122,95,0) 70%),
      linear-gradient(180deg,
        #06070f 0%,
        #0d1326 10%,
        #1c1f3a 22%,
        #3a2240 32%,
        #6b2d3a 44%,
        #a0432f 56%,
        #c95b34 64%,
        #d97241 70%,
        #b25535 76%,
        #5d2520 84%,
        #1a1318 92%,
        #06070f 100%
      );
  }

  .sun{
    position:absolute;
    top:300px;left:32%;
    transform:translate(-50%,0);
    width:500px;height:500px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #ffeebd 0%, #fcd17a 18%, #f6a85a 42%, #e07a5f 72%, #c25237 100%);
    box-shadow:0 0 80px 25px rgba(252,209,122,0.4), 0 0 220px 70px rgba(224,122,95,0.28);
    z-index:1;
  }
  .horizon{
    position:absolute;top:780px;left:0;width:60%;height:1.5px;
    background:linear-gradient(90deg, transparent 0%, rgba(255,200,140,0.5) 20%, rgba(255,220,170,0.85) 50%, rgba(255,200,140,0.5) 80%, transparent 100%);
    z-index:6;filter:blur(0.6px);opacity:0.85;
  }
  .ocean{
    position:absolute;left:0;top:790px;width:60%;height:290px;
    background:linear-gradient(180deg,
      rgba(8,11,22,0.20) 0%,
      rgba(8,11,22,0.55) 25%,
      rgba(6,8,16,0.85) 60%,
      #06070f 100%);
    z-index:3;
  }
  .light-streak{
    position:absolute;left:32%;top:775px;
    width:90px;transform:translateX(-50%);height:290px;
    background:linear-gradient(180deg, rgba(255,220,150,0.75) 0%, rgba(252,209,122,0.4) 18%, rgba(224,122,95,0.22) 40%, rgba(0,0,0,0) 85%);
    filter:blur(10px);z-index:4;mix-blend-mode:screen;opacity:0.95;
  }
  .ripple{position:absolute;left:32%;transform:translateX(-50%);background:rgba(255,224,170,0.85);border-radius:50%;z-index:5;mix-blend-mode:screen;filter:blur(0.4px)}
  .r1{top:795px;width:80px;height:2px;opacity:0.95}
  .r2{top:830px;width:140px;height:2px;opacity:0.7}
  .r3{top:875px;width:220px;height:2px;opacity:0.5}
  .r4{top:930px;width:320px;height:2px;opacity:0.32}
  .r5{top:990px;width:450px;height:1.5px;opacity:0.18}

  .star{position:absolute;width:2px;height:2px;background:#fbf6e8;border-radius:50%;z-index:7;box-shadow:0 0 4px rgba(251,246,232,0.95)}

  /* Right side darker overlay to separate info zone */
  .info-overlay{
    position:absolute;top:0;right:0;width:38%;height:100%;
    background:linear-gradient(90deg, rgba(6,7,15,0) 0%, rgba(6,7,15,0.4) 25%, rgba(6,7,15,0.75) 100%);
    z-index:2;
  }

  .palm{position:absolute;z-index:8;pointer-events:none}
  .palm-tl{top:-30px;left:-80px;width:420px;transform:rotate(-8deg)}
  .palm-tr{top:-50px;right:-100px;width:420px;transform:rotate(8deg) scaleX(-1)}

  .top-bar{
    position:absolute;top:42px;left:60px;right:60px;
    display:flex;justify-content:space-between;align-items:center;z-index:20;
    font-family:'Inter';font-size:11px;font-weight:600;
    letter-spacing:0.32em;text-transform:uppercase;
    color:rgba(251,246,232,0.85);
  }
  .top-bar .left{display:flex;align-items:center;gap:14px}
  .top-bar .left::before{content:"";display:inline-block;width:22px;height:1px;background:rgba(212,184,122,0.95)}
  .top-bar .right{color:#d4b87a}

  /* HERO — left aligned, big */
  .hero{
    position:absolute;top:330px;left:80px;z-index:10;text-align:left;
  }
  .hero span{
    display:block;
    font-family:'Instrument Serif', Georgia, serif;
    font-style:italic;font-weight:400;color:#fbf6e8;
    line-height:0.85;letter-spacing:-0.028em;
    text-shadow:0 8px 60px rgba(0,0,0,0.55);
  }
  .hero .line1{font-size:300px}
  .hero .line2{font-size:300px;margin-top:-20px;margin-left:54px}
  .hero .dot{color:#f4b942;font-style:italic}

  /* INFO column (right) */
  .info-col{
    position:absolute;
    top:140px;right:80px;
    width:560px;
    z-index:15;
    text-align:right;
  }
  .info-eyebrow{
    font-family:'Inter';font-size:11px;font-weight:700;
    letter-spacing:0.42em;text-transform:uppercase;
    color:#d4b87a;
    margin-bottom:30px;
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
  }
  .info-eyebrow::after{
    content:"";display:inline-block;width:24px;height:1px;
    background:rgba(212,184,122,0.9);
  }
  .info-place{
    font-family:'Instrument Serif', Georgia, serif;
    font-style:italic;font-weight:400;font-size:140px;line-height:0.9;
    color:#fbf6e8;letter-spacing:-0.025em;margin-bottom:14px;
    text-shadow:0 4px 30px rgba(0,0,0,0.55);
  }
  .info-venue{
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;font-weight:400;font-size:36px;line-height:1.1;
    color:#d4b87a;margin-bottom:42px;letter-spacing:-0.005em;
  }
  .info-rule{
    height:1px;
    background:linear-gradient(90deg, rgba(212,184,122,0) 0%, rgba(212,184,122,0.7) 50%, rgba(212,184,122,0) 100%);
    margin:0 0 28px;width:100%;
  }
  .info-meta{
    font-family:'Inter';font-size:16px;font-weight:700;
    letter-spacing:0.42em;text-transform:uppercase;color:#d4b87a;
    margin-bottom:22px;
  }
  .info-meta .sep{display:inline-block;margin:0 14px;color:rgba(212,184,122,0.45)}
  .info-details{
    font-family:'Fraunces', Georgia, serif;
    font-weight:400;font-style:italic;font-size:28px;
    line-height:1.25;color:rgba(251,246,232,0.98);
    margin-bottom:28px;
  }
  .info-details .dot{color:#f4b942;margin:0 12px;font-style:normal}
  .info-details .ymas{color:#d4b87a}

  /* FOOTER — Sora bottom left, QR bottom right */
  .footer-left{
    position:absolute;bottom:50px;left:80px;z-index:25;
  }
  .sora-mark{
    font-family:'Instrument Serif', Georgia, serif;
    font-weight:400;font-size:90px;line-height:0.9;
    letter-spacing:0.32em;text-indent:0.32em;color:#fbf6e8;
  }

  .footer-right{
    position:absolute;bottom:50px;right:80px;z-index:25;
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  }
  .qr-cta{
    font-family:'Fraunces';font-style:italic;font-weight:400;
    font-size:18px;line-height:1.1;color:#fbf6e8;
    text-align:right;margin-bottom:3px;
  }
  .qr-frame{
    width:140px;height:140px;background:#fbf6e8;
    padding:10px;border-radius:5px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);position:relative;
  }
  .qr-frame::before{
    content:"";position:absolute;inset:-4px;
    border:1px solid rgba(212,184,122,0.55);border-radius:7px;pointer-events:none;
  }
  .qr-frame svg{width:100% !important;height:100% !important;display:block}
  .qr-meta{
    font-family:'Inter';font-weight:700;font-size:9px;
    letter-spacing:0.40em;text-transform:uppercase;color:#d4b87a;
    text-align:right;margin-top:4px;
  }

  .grain{position:absolute;inset:0;z-index:50;opacity:0.16;mix-blend-mode:overlay;pointer-events:none}
</style>
</head>
<body>

<div class="flyer">
  <div class="sky"></div>

  <div class="star" style="top:70px;left:240px"></div>
  <div class="star" style="top:100px;left:430px;width:3px;height:3px"></div>
  <div class="star" style="top:60px;left:680px;opacity:0.85"></div>
  <div class="star" style="top:140px;left:960px"></div>
  <div class="star" style="top:90px;left:1280px;width:3px;height:3px"></div>
  <div class="star" style="top:170px;left:380px;opacity:0.55"></div>
  <div class="star" style="top:200px;left:840px;opacity:0.6"></div>
  <div class="star" style="top:240px;left:140px;opacity:0.45"></div>
  <div class="star" style="top:220px;left:1500px;opacity:0.6"></div>

  <div class="sun"></div>
  <div class="horizon"></div>
  <div class="ocean"></div>
  <div class="light-streak"></div>
  <div class="ripple r1"></div>
  <div class="ripple r2"></div>
  <div class="ripple r3"></div>
  <div class="ripple r4"></div>
  <div class="ripple r5"></div>

  <div class="info-overlay"></div>

  <!-- Palm defs -->
  <svg width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="palm-frond-ls">
        <path d="M 0 0 Q 80 -20 200 -40 T 380 -40" stroke="#04060e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g fill="#04060e">
          <ellipse cx="40"  cy="-12" rx="22" ry="5" transform="rotate(-30 40 -12)"/>
          <ellipse cx="40"  cy="0"   rx="22" ry="5" transform="rotate( 30 40 0)"/>
          <ellipse cx="70"  cy="-22" rx="26" ry="5.5" transform="rotate(-32 70 -22)"/>
          <ellipse cx="70"  cy="-2"  rx="26" ry="5.5" transform="rotate( 32 70 -2)"/>
          <ellipse cx="100" cy="-30" rx="30" ry="6" transform="rotate(-34 100 -30)"/>

          <ellipse cx="135" cy="-38" rx="32" ry="6" transform="rotate(-36 135 -38)"/>
          <ellipse cx="135" cy="-10" rx="32" ry="6" transform="rotate( 36 135 -10)"/>
          <ellipse cx="170" cy="-44" rx="34" ry="6" transform="rotate(-38 170 -44)"/>
          <ellipse cx="170" cy="-14" rx="34" ry="6" transform="rotate( 38 170 -14)"/>
          <ellipse cx="210" cy="-48" rx="34" ry="5.5" transform="rotate(-40 210 -48)"/>
          <ellipse cx="210" cy="-18" rx="34" ry="5.5" transform="rotate( 40 210 -18)"/>
          <ellipse cx="250" cy="-50" rx="32" ry="5" transform="rotate(-42 250 -50)"/>
          <ellipse cx="250" cy="-22" rx="32" ry="5" transform="rotate( 42 250 -22)"/>
          <ellipse cx="290" cy="-50" rx="28" ry="4.5" transform="rotate(-44 290 -50)"/>
          <ellipse cx="290" cy="-26" rx="28" ry="4.5" transform="rotate( 44 290 -26)"/>
          <ellipse cx="325" cy="-48" rx="22" ry="4" transform="rotate(-46 325 -48)"/>
          <ellipse cx="325" cy="-30" rx="22" ry="4" transform="rotate( 46 325 -30)"/>
          <path d="M 360 -42 Q 380 -50 392 -40 Q 380 -32 360 -38 Z"/>
        </g>
      </g>
      <g id="palm-tree-ls">
        <path d="M 296 800 C 290 660, 298 540, 312 420 C 322 320, 332 230, 340 160 C 343 130, 344 112, 345 100" stroke="#04060e" stroke-width="12" fill="none" stroke-linecap="round"/>
        <g stroke="#04060e" stroke-width="2" opacity="0.55" fill="none">
          <path d="M 290 760 q 11 -3 17 0"/>
          <path d="M 293 700 q 11 -3 17 0"/>
          <path d="M 297 640 q 11 -3 17 0"/>
          <path d="M 302 580 q 11 -3 17 0"/>
          <path d="M 307 520 q 11 -3 17 0"/>
          <path d="M 313 460 q 11 -3 17 0"/>
          <path d="M 320 400 q 11 -3 17 0"/>
          <path d="M 326 340 q 11 -3 17 0"/>
          <path d="M 332 280 q 11 -3 17 0"/>
          <path d="M 338 220 q 11 -3 17 0"/>
          <path d="M 342 160 q 11 -3 17 0"/>
        </g>
        <g fill="#04060e">
          <ellipse cx="338" cy="106" rx="8" ry="9"/>
          <ellipse cx="350" cy="108" rx="8" ry="9"/>
          <ellipse cx="344" cy="116" rx="8" ry="9"/>
        </g>
        <g>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(190)"/>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(215)"/>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(245)"/>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(285)"/>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(330)"/>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(20)"/>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(75)"/>
          <use href="#palm-frond-ls" transform="translate(345 100) rotate(155)"/>
        </g>
      </g>
    </defs>
  </svg>

  <svg class="palm palm-tl" viewBox="0 0 700 800" xmlns="http://www.w3.org/2000/svg">
    <use href="#palm-tree-ls"/>
  </svg>
  <svg class="palm palm-tr" viewBox="0 0 700 800" xmlns="http://www.w3.org/2000/svg">
    <use href="#palm-tree-ls"/>
  </svg>

  <div class="top-bar">
    <div class="left">VOL. I · MMXXVI</div>
    <div class="right">PEDASÍ NIGHTS</div>
  </div>

  <!-- LEFT: hero -->
  <div class="hero">
    <span class="line1">beach</span>
    <span class="line2">party<span class="dot">.</span></span>
  </div>

  <!-- RIGHT: info column -->
  <div class="info-col">
    <div class="info-eyebrow">SÁBADO 6 JUNIO · MMXXVI</div>
    <div class="info-place">Pedasí.</div>
    <div class="info-venue">Andrómeda Beach Club</div>
    <div class="info-rule"></div>
    <div class="info-meta">4 PM<span class="sep">/</span>FRENTE AL MAR</div>
    <div class="info-details">DJ <span class="dot">·</span> Comida <span class="dot">·</span> Bebidas <span class="dot">·</span> <span class="ymas">y mucho más</span></div>
  </div>

  <!-- FOOTER LEFT -->
  <div class="footer-left">
    <div class="sora-mark">SORA</div>
  </div>

  <!-- FOOTER RIGHT -->
  <div class="footer-right">
    <div class="qr-cta">únete al chat.</div>
    <div class="qr-frame" id="qr"></div>
    <div class="qr-meta">WHATSAPP · RSVP</div>
  </div>

  <svg class="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95
                             0 0 0 0 0.92
                             0 0 0 0 0.82
                             0 0 0 0.7 0"/>
    </filter>
    <rect width="1920" height="1080" filter="url(#n)"/>
  </svg>
</div>

<script>
  (function(){
    var qr = qrcode(0, 'M');
    qr.addData('https://wa.me/50760003558');
    qr.make();
    var el = document.getElementById('qr');
    if(el) el.innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
  })();
</script>
</body>
</html>
