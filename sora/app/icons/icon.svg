<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16201a"/>
      <stop offset="55%" stop-color="#1f2d24"/>
      <stop offset="100%" stop-color="#2c4032"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.3" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#f0d99b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d4b87a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a07b3e" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#d4b87a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d4b87a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <!-- Golden ambient glow -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <!-- Faint orbital rings -->
  <g opacity="0.45" fill="none" stroke="#d4b87a">
    <circle cx="512" cy="512" r="360" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="260" stroke-width="1.2"/>
    <circle cx="512" cy="512" r="160" stroke-width="0.9"/>
  </g>

  <!-- Horizon curves -->
  <g opacity="0.55" fill="none" stroke="#a07b3e" stroke-linecap="round">
    <path d="M 110 700 Q 320 540, 540 640 T 920 580" stroke-width="3"/>
    <path d="M 110 790 Q 380 720, 620 760 T 920 730" stroke-width="2"/>
  </g>

  <!-- Sun disc -->
  <circle cx="690" cy="360" r="110" fill="url(#sun)"/>

  <!-- SORA wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="300" fill="#f5efe1" text-anchor="middle">
    <text x="512" y="930" font-size="118" letter-spacing="28">SORA</text>
  </g>
</svg>
