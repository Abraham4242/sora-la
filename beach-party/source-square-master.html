<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beach Party · Pedasí · Square</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#070912}

  .flyer{
    position:relative;
    width:1080px;
    height:1080px;
    overflow:hidden;
    color:#fbf6e8;
    font-family:'Inter',sans-serif;
    isolation:isolate;
  }

  .sky{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 65% 45% at 50% 42%, rgba(255,221,150,0.55) 0%, rgba(255,221,150,0) 60%),
      radial-gradient(ellipse 100% 50% at 50% 52%, rgba(224,122,95,0.78) 0%, rgba(224,122,95,0) 70%),
      linear-gradient(180deg,
        #06070f 0%,
        #0d1326 10%,
        #1c1f3a 20%,
        #3a2240 30%,
        #6b2d3a 40%,
        #a0432f 50%,
        #c95b34 58%,
        #d97241 64%,
        #b25535 72%,
        #5d2520 82%,
        #1a1318 90%,
        #06070f 100%
      );
  }

  .sun{
    position:absolute;
    top:280px;left:50%;
    transform:translateX(-50%);
    width:520px;height:520px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #ffeebd 0%, #fcd17a 18%, #f6a85a 42%, #e07a5f 72%, #c25237 100%);
    box-shadow:0 0 80px 25px rgba(252,209,122,0.4), 0 0 220px 70px rgba(224,122,95,0.28);
    z-index:1;
  }

  .horizon{
    position:absolute;top:670px;left:0;right:0;height:1.5px;
    background:linear-gradient(90deg, transparent 0%, rgba(255,200,140,0.5) 30%, rgba(255,220,170,0.85) 50%, rgba(255,200,140,0.5) 70%, transparent 100%);
    z-index:6;
    filter:blur(0.6px);opacity:0.85;
  }

  .ocean{
    position:absolute;left:0;right:0;top:680px;height:400px;
    background:linear-gradient(180deg,
      rgba(8,11,22,0.20) 0%,
      rgba(8,11,22,0.55) 25%,
      rgba(6,8,16,0.85) 60%,
      #06070f 100%);
    z-index:3;
  }
  .light-streak{
    position:absolute;left:50%;top:665px;
    width:110px;transform:translateX(-50%);height:400px;
    background:linear-gradient(180deg, rgba(255,220,150,0.75) 0%, rgba(252,209,122,0.4) 18%, rgba(224,122,95,0.22) 40%, rgba(0,0,0,0) 85%);
    filter:blur(10px);z-index:4;mix-blend-mode:screen;opacity:0.95;
  }
  .ripple{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,224,170,0.85);border-radius:50%;z-index:5;mix-blend-mode:screen;filter:blur(0.4px)}
  .r1{top:685px;width:100px;height:2px;opacity:0.95}
  .r2{top:720px;width:170px;height:2px;opacity:0.7}
  .r3{top:765px;width:260px;height:2px;opacity:0.5}
  .r4{top:820px;width:380px;height:2px;opacity:0.32}
  .r5{top:880px;width:540px;height:1.5px;opacity:0.18}

  .star{position:absolute;width:2px;height:2px;background:#fbf6e8;border-radius:50%;z-index:7;box-shadow:0 0 4px rgba(251,246,232,0.95)}

  .palm{position:absolute;z-index:8;pointer-events:none}
  .palm-left{top:-40px;left:-100px;width:480px;transform:rotate(-8deg)}
  .palm-right{top:-20px;right:-130px;width:500px;transform:rotate(10deg) scaleX(-1)}

  .top-bar{
    position:absolute;top:44px;left:48px;right:48px;
    display:flex;justify-content:space-between;align-items:center;z-index:20;
    font-family:'Inter';font-size:11px;font-weight:600;
    letter-spacing:0.32em;text-transform:uppercase;
    color:rgba(251,246,232,0.85);
  }
  .top-bar .left{display:flex;align-items:center;gap:14px}
  .top-bar .left::before{content:"";display:inline-block;width:22px;height:1px;background:rgba(212,184,122,0.95)}
  .top-bar .right{color:#d4b87a}

  .hero{
    position:absolute;top:185px;left:0;right:0;text-align:center;z-index:10;
  }
  .hero span{
    display:block;
    font-family:'Instrument Serif', Georgia, serif;
    font-style:italic;font-weight:400;color:#fbf6e8;
    line-height:0.85;letter-spacing:-0.028em;
    text-shadow:0 8px 60px rgba(0,0,0,0.55);
  }
  .hero .line1{font-size:180px}
  .hero .line2{font-size:180px;margin-top:-12px}
  .hero .dot{color:#f4b942;font-style:italic}

  .center-info{
    position:absolute;top:735px;left:0;right:0;text-align:center;z-index:15;
  }
  .place{
    font-family:'Instrument Serif', Georgia, serif;
    font-style:italic;font-weight:400;font-size:62px;line-height:1;
    color:#fbf6e8;letter-spacing:-0.022em;margin-bottom:8px;
    text-shadow:0 4px 30px rgba(0,0,0,0.55);
  }
  .place .dot-orn{color:#f4b942;margin:0 12px;vertical-align:10px;font-size:28px;font-style:normal}
  .venue{
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;font-weight:400;font-size:26px;line-height:1;
    color:#d4b87a;margin-bottom:18px;letter-spacing:-0.005em;
  }
  .date-row{
    font-family:'Inter';font-size:14px;font-weight:700;
    letter-spacing:0.40em;text-transform:uppercase;color:#d4b87a;
  }
  .date-row .sep{display:inline-block;margin:0 10px;color:rgba(212,184,122,0.45)}

  .details-wrap{
    position:absolute;top:892px;left:80px;right:80px;z-index:15;text-align:center;
  }
  .rule{
    height:1px;
    background:linear-gradient(90deg, rgba(212,184,122,0) 0%, rgba(212,184,122,0.45) 28%, rgba(212,184,122,0.7) 50%, rgba(212,184,122,0.45) 72%, rgba(212,184,122,0) 100%);
    margin:0 auto 12px;width:100%;
  }
  .details{
    font-family:'Fraunces', Georgia, serif;
    font-weight:400;font-style:italic;font-size:22px;
    line-height:1.2;color:rgba(251,246,232,0.98);
  }
  .details .dot{color:#f4b942;margin:0 10px;font-style:normal}
  .details .ymas{color:#d4b87a}
  .rule-2{margin-top:12px;margin-bottom:0}

  .footer{
    position:absolute;bottom:36px;left:48px;right:48px;
    display:flex;justify-content:space-between;align-items:flex-end;z-index:25;
  }
  .logo-block{
    display:flex;flex-direction:column;align-items:flex-start;
    justify-content:flex-end;padding-bottom:14px;
  }
  .sora-mark{
    font-family:'Instrument Serif', Georgia, serif;
    font-weight:400;font-size:62px;line-height:0.9;
    letter-spacing:0.32em;text-indent:0.32em;color:#fbf6e8;
  }

  .qr-block{
    display:flex;flex-direction:column;align-items:flex-end;
    gap:4px;max-width:180px;
  }
  .qr-cta{
    font-family:'Fraunces';font-style:italic;font-weight:400;
    font-size:15px;line-height:1.1;color:#fbf6e8;
    text-align:right;margin-bottom:3px;
  }
  .qr-frame{
    width:124px;height:124px;background:#fbf6e8;
    padding:9px;border-radius:5px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);position:relative;
  }
  .qr-frame::before{
    content:"";position:absolute;inset:-4px;
    border:1px solid rgba(212,184,122,0.55);border-radius:7px;pointer-events:none;
  }
  .qr-frame svg{width:100% !important;height:100% !important;display:block}
  .qr-meta{
    font-family:'Inter';font-weight:700;font-size:8.5px;
    letter-spacing:0.40em;text-transform:uppercase;color:#d4b87a;
    text-align:right;margin-top:3px;
  }

  .grain{position:absolute;inset:0;z-index:50;opacity:0.16;mix-blend-mode:overlay;pointer-events:none}
</style>
</head>
<body>

<script>
  (function(){
    var qr = qrcode(0, 'M');
    qr.addData('https://wa.me/50760003558');
    qr.make();
    var el = document.getElementById('qr');
    if(el) el.innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
  })();
</script>
